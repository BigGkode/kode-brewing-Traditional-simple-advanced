<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODE of Brewing - Lab</title>
    <!-- Tailwind CSS for modern, clean styling -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Custom earthy coffee color palette styling */
        :root {
            --bg-color: #F4F1EA;
            --dark-green: #1C352D;
            --accent-tan: #EBE5D8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--dark-green);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-active {
            background-color: var(--dark-green) !important;
            color: white !important;
        }
    </style>
</head>
<body class="p-4 md:p-8 max-w-md mx-auto">

    <!-- Header Section -->
    <header class="text-center my-6">
        <h1 class="text-3xl font-serif font-bold tracking-tight">KODE of Brewing</h1>
        <p class="text-sm opacity-75 mt-1">Interactive Extraction Lab</p>
    </header>

    <!-- Navigation Toggles -->
    <div class="flex justify-center space-x-2 my-6 bg-[#EBE5D8] p-1 rounded-full text-sm font-medium">
        <button id="btn-simple" class="flex-1 py-1.5 px-4 rounded-full transition-all btn-active" onclick="setMode('simple')">Simple</button>
        <button id="btn-advanced" class="flex-1 py-1.5 px-4 rounded-full transition-all text-gray-600" onclick="setMode('advanced')">Advanced</button>
        <button id="btn-actual" class="flex-1 py-1.5 px-4 rounded-full transition-all text-gray-600" onclick="setMode('actual')">Actual</button>
    </div>

    <!-- Main Dynamic Interface Card -->
    <main class="bg-white rounded-2xl p-6 shadow-sm border border-[#E4DFD5] space-y-6">
        <h2 id="view-title" class="text-xl font-bold tracking-wide">Bloom, Turbulence, Drawdown</h2>
        
        <!-- Placeholder for Interactive Visual/Canvas -->
        <div class="aspect-square w-full bg-[#FBFBFA] rounded-xl border border-dashed border-gray-300 flex flex-col items-center justify-center p-4 text-center">
            <span class="text-4xl mb-2">☕</span>
            <p class="text-xs text-gray-500 font-mono">Interactive Chart Area</p>
            <p id="mode-status" class="text-xs text-emerald-700 font-semibold mt-1">Currently displaying: Simple Mode</p>
        </div>

        <!-- Recipe Controls Area -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1">Water Input (grams)</label>
                <input type="number" id="water-input" value="250" class="w-full bg-[#F4F1EA] border border-transparent rounded-xl p-3 text-lg font-semibold focus:outline-none focus:border-[#1C352D]" oninput="calculateBrew()">
            </div>
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1">Target Coffee Ratio (1:x)</label>
                <input type="number" id="ratio-input" value="16" class="w-full bg-[#F4F1EA] border border-transparent rounded-xl p-3 text-lg font-semibold focus:outline-none focus:border-[#1C352D]" oninput="calculateBrew()">
            </div>

            <!-- Auto-Calculated Output Result -->
            <div class="bg-[#1C352D] text-[#F4F1EA] p-4 rounded-xl text-center shadow-inner">
                <p class="text-xs uppercase tracking-widest opacity-75">Required Coffee Grounds</p>
                <p id="coffee-output" class="text-3xl font-black mt-1">15.6g</p>
            </div>
        </div>
    </main>

    <!-- Simple JavaScript Interaction Script -->
    <script>
        // Function to handle switching views (Simple, Advanced, Actual)
        function setMode(mode) {
            // Reset active states on all buttons
            document.getElementById('btn-simple').classList.remove('btn-active', 'text-gray-600');
            document.getElementById('btn-advanced').classList.remove('btn-active', 'text-gray-600');
            document.getElementById('btn-actual').classList.remove('btn-active', 'text-gray-600');
            
            // Highlight the active clicked button
            document.getElementById('btn-' + mode).classList.add('btn-active');
            
            // Dynamically change text elements based on selected mode
            const statusText = document.getElementById('mode-status');
            const viewTitle = document.getElementById('view-title');
            
            if (mode === 'simple') {
                viewTitle.innerText = "Bloom, Turbulence, Drawdown";
                statusText.innerText = "Currently displaying: Simple Mode";
            } else if (mode === 'advanced') {
                viewTitle.innerText = "Advanced Control & Extraction Window";
                statusText.innerText = "Currently displaying: Advanced Grid";
            } else if (mode === 'actual') {
                viewTitle.innerText = "Actual Live Brew Data Tracking";
                statusText.innerText = "Currently displaying: Real-time Plotting";
            }
        }

        // Mathematical calculation function for the coffee brew
        function calculateBrew() {
            const water = parseFloat(document.getElementById('water-input').value) || 0;
            const ratio = parseFloat(document.getElementById('ratio-input').value) || 1;
            
            if (ratio > 0) {
                const coffeeRequired = (water / ratio).toFixed(1);
                document.getElementById('coffee-output').innerText = coffeeRequired + "g";
            }
        }
    </script>
</body>
</html>
