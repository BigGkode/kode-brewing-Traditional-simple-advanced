<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODE of Brewing - Visual Lab</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #F5F2EB;
            --dark-green: #1B362C;
            --accent-tan: #EAE3D5;
        }
        body {
            background-color: var(--bg-color);
            color: var(--dark-green);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-active {
            background-color: var(--dark-green) !important;
            color: white !important;
        }
    </style>
</head>
<body class="p-4 md:p-8 max-w-lg mx-auto">

    <!-- Header -->
    <header class="text-center my-4">
        <h1 class="text-3xl font-serif font-bold tracking-tight">KODE of Brewing</h1>
        <p class="text-xs opacity-75 uppercase tracking-widest mt-1">Extraction Control Lab</p>
    </header>

    <!-- Nav Toggles -->
    <div class="flex justify-center space-x-2 my-4 bg-[#EAE3D5] p-1 rounded-full text-xs font-semibold">
        <button id="btn-simple" class="flex-1 py-2 px-3 rounded-full transition-all btn-active" onclick="setMode('simple')">Simple</button>
        <button id="btn-advanced" class="flex-1 py-2 px-3 rounded-full transition-all text-gray-600" onclick="setMode('advanced')">Advanced</button>
        <button id="btn-actual" class="flex-1 py-2 px-3 rounded-full transition-all text-gray-600" onclick="setMode('actual')">Actual</button>
    </div>

    <!-- Main Workspace -->
    <main class="bg-white rounded-2xl p-5 shadow-md border border-[#E1D9CC] space-y-4">
        
        <!-- Live Extraction Chart Title -->
        <div class="flex justify-between items-center border-b border-gray-100 pb-2">
            <h2 id="view-title" class="text-md font-bold tracking-wide uppercase">Coffee Control Chart</h2>
            <span id="extraction-status" class="text-xs px-2 py-0.5 rounded-full font-mono bg-amber-100 text-amber-800">Plotting</span>
        </div>
        
        <!-- INTERACTIVE GRAPH CANVAS -->
        <div class="relative w-full bg-white rounded-xl border border-gray-200 p-2 flex justify-center items-center">
            <canvas id="brewChart" width="400" height="350" class="w-full h-auto"></canvas>
        </div>

        <!-- Inputs Grid -->
        <div class="grid grid-cols-2 gap-3 text-left">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1 text-gray-500">Coffee Grounds (g)</label>
                <input type="number" id="coffee-input" value="15.0" step="0.1" class="w-full bg-[#F5F2EB] rounded-xl p-2.5 font-mono font-bold focus:outline-none focus:ring-1 focus:ring-[#1B362C]" oninput="updateChart()">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1 text-gray-500">Water Volume (g)</label>
                <input type="number" id="water-input" value="250" step="1" class="w-full bg-[#F5F2EB] rounded-xl p-2.5 font-mono font-bold focus:outline-none focus:ring-1 focus:ring-[#1B362C]" oninput="updateChart()">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1 text-gray-500">Target TDS / Strength (%)</label>
                <input type="number" id="tds-input" value="1.35" step="0.05" class="w-full bg-[#F5F2EB] rounded-xl p-2.5 font-mono font-bold focus:outline-none focus:ring-1 focus:ring-[#1B362C]" oninput="updateChart()">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider mb-1 text-gray-500">Calculated Yield (%)</label>
                <div id="yield-display" class="w-full bg-[#1B362C] text-white rounded-xl p-2.5 font-mono font-bold text-center">22.5%</div>
            </div>
        </div>
    </main>

    <!-- Chart Engine Script -->
    <script>
        const canvas = document.getElementById('brewChart');
        const ctx = canvas.getContext('2d');

        function setMode(mode) {
            document.getElementById('btn-simple').classList.remove('btn-active', 'text-gray-600');
            document.getElementById('btn-advanced').classList.remove('btn-active', 'text-gray-600');
            document.getElementById('btn-actual').classList.remove('btn-active', 'text-gray-600');
            document.getElementById('btn-' + mode).classList.add('btn-active');
            
            const title = document.getElementById('view-title');
            if (mode === 'simple') title.innerText = "Coffee Control Chart";
            if (mode === 'advanced') title.innerText = "Advanced Target Windows";
            if (mode === 'actual') title.innerText = "Live Extraction Track";
            updateChart();
        }

        function updateChart() {
            const coffee = parseFloat(document.getElementById('coffee-input').value) || 0;
            const water = parseFloat(document.getElementById('water-input').value) || 0;
            const tds = parseFloat(document.getElementById('tds-input').value) || 0;
            
            const liquidWeight = water - (coffee * 2);
            let extYield = 0;
            if (coffee > 0 && liquidWeight > 0) {
                extYield = ((tds * liquidWeight) / coffee);
            }
            
            document.getElementById('yield-display').innerText = extYield.toFixed(1) + "%";

            const statusBadge = document.getElementById('extraction-status');
            if (extYield < 18) {
                statusBadge.innerText = "Under-Extracted";
                statusBadge.className = "text-xs px-2 py-0.5 rounded-full font-mono bg-red-100 text-red-800";
            } else if (extYield > 22) {
                statusBadge.innerText = "Over-Extracted";
                statusBadge.className = "text-xs px-2 py-0.5 rounded-full font-mono bg-purple-100 text-purple-800";
            } else {
                statusBadge.innerText = "Ideal Balance";
                statusBadge.className = "text-xs px-2 py-0.5 rounded-full font-mono bg-emerald-100 text-emerald-800";
            }

            drawGraph(extYield, tds);
        }

        function drawGraph(currentYield, currentTds) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const padding = 40;
            const graphWidth = canvas.width - padding * 2;
            const graphHeight = canvas.height - padding * 2;

            const minX = 14, maxX = 26; 
            const minY = 0.8, maxY = 1.6; 

            function getX(val) { return padding + ((val - minX) / (maxX - minX)) * graphWidth; }
            function getY(val) { return canvas.height - padding - ((val - minY) / (maxY - minY)) * graphHeight; }

            ctx.fillStyle = 'rgba(235, 245, 240, 0.8)'; 
            ctx.fillRect(getX(18), getY(1.45), getX(22) - getX(18), getY(1.15) - getY(1.45));
            ctx.strokeStyle = '#1B362C';
            ctx.lineWidth = 1;
            ctx.strokeRect(getX(18), getY(1.45), getX(22) - getX(18), getY(1.15) - getY(1.45));

            ctx.strokeStyle = '#EAE3D5';
            ctx.fillStyle = '#666';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';

            for(let x = minX; x <= maxX; x += 2) {
                ctx.beginPath();
                ctx.moveTo(getX(x), padding);
                ctx.lineTo(getX(x), canvas.height - padding);
                ctx.stroke();
                ctx.fillText(x + '%', getX(x), canvas.height - padding + 15);
            }

            ctx.textAlign = 'right';
            for(let y = minY; y <= maxY; y += 0.2) {
                ctx.beginPath();
                ctx.moveTo(padding, getY(y));
                ctx.lineTo(canvas.width - padding, getY(y));
                ctx.stroke();
                ctx.fillText(y.toFixed(1) + '%', padding - 8, getY(y) + 3);
            }

            ctx.strokeStyle = '#1B362C';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, canvas.height - padding);
            ctx.lineTo(canvas.width - padding, canvas.height - padding);
            ctx.stroke();

            ctx.fillStyle = '#1B362C';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('EXTRACTION YIELD (%)', canvas.width / 2, canvas.height - 8);
            
            ctx.save();
            ctx.translate(12, canvas.height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('STRENGTH / TDS (%)', 0, 0);
            ctx.restore();

            if (currentYield >= minX && currentYield <= maxX && currentTds >= minY && currentTds <= maxY) {
                ctx.beginPath();
                ctx.arc(getX(currentYield), getY(currentTds), 7, 0, 2 * Math.PI);
                ctx.fillStyle = '#C2410C'; 
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#C2410C';
                ctx.fill();
                ctx.shadowBlur = 0; 
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        updateChart();
    </script>
</body>
</html>
